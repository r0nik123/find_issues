# Put this file at: .github/workflows/scan.yml (replace the old one)
name: Find contributions

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests codespell

      - name: Run scanner
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python -u find_contributions.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results.md results.json
          git diff --staged --quiet || git commit -m "Update contributions list"
          git push
